name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true
        type: string

permissions:
  contents: write

env:
  HTSLIB_VERSION: "1.25"

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            zlib1g-dev curl bzip2 samtools
      - name: Build static binary
        run: |
          JOBS=4 ./scripts/build-static.sh
          file dist/husk-*-linux-x86_64
      - name: Smoke test
        run: ./tests/integration/smoke.sh dist/husk-*-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/husk-*-linux-x86_64
          if-no-files-found: error

  linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            zlib1g-dev curl bzip2 samtools
      - name: Build static binary
        run: |
          JOBS=4 ./scripts/build-static.sh
          file dist/husk-*-linux-aarch64
      - name: Smoke test
        run: ./tests/integration/smoke.sh dist/husk-*-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: dist/husk-*-linux-aarch64
          if-no-files-found: error

  macos-universal2:
    name: macOS universal2
    runs-on: macos-14
    env:
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "${MACOS_CERTIFICATE_P12}" | base64 --decode >certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain \
            -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k actions build.keychain
          rm certificate.p12
      - name: Build universal2 binary
        run: ./scripts/build-macos-universal.sh
      - name: Verify architecture
        run: lipo -info dist/husk-*-macos-universal2
      - name: Smoke test
        run: |
          brew install samtools
          ./tests/integration/smoke.sh dist/husk-*-macos-universal2
      - name: Notarize
        if: env.APPLE_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          asset=$(ls dist/husk-*-macos-universal2)
          ditto -c -k --keepParent "${asset}" "${asset}.zip"
          xcrun notarytool submit "${asset}.zip" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --wait
          # A standalone Mach-O file cannot be stapled. Gatekeeper checks the
          # notarization ticket online when the binary is first run.
          rm "${asset}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal2
          path: dist/husk-*-macos-universal2
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-samtools
            make
            bzip2
      - name: Build static binary
        run: bash scripts/build-windows.sh
      - name: Smoke test with a space in the path
        run: |
          mkdir -p "dist/with space"
          cp dist/husk-*-windows-x86_64.exe "dist/with space/husk.exe"
          bash tests/integration/smoke.sh "dist/with space/husk.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/husk-*-windows-x86_64.exe
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - linux-x86_64
      - linux-aarch64
      - macos-universal2
      - windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "VERSION=${version}" >>"${GITHUB_ENV}"
      - name: Create source tarball
        run: |
          git archive --format=tar.gz \
            --prefix="bamhusk-${VERSION}/" \
            -o "dist/bamhusk-${VERSION}-src.tar.gz" HEAD
      - name: Generate manifest and checksums
        run: |
          python3 scripts/make-manifest.py \
            --dir dist \
            --version "${VERSION}" \
            --require-all
          python3 scripts/make-manifest.py --dir dist --verify
          python3 -m pip install --user --break-system-packages jsonschema
          python3 scripts/validate-manifest.py dist/manifest.json
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Husk v${{ env.VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
